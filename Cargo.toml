[package]
name = "microgames"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "no_std microgame business logic: plug in events, input, and output"
homepage = "https://github.com/t4ce/MicroGames"
repository = "https://github.com/t4ce/MicroGames"
documentation = "https://docs.rs/microgames"
readme = "README.md"
keywords = ["games", "no-std", "tetris", "embedded", "logic"]
categories = ["game-development", "no-std", "embedded"]
include = ["Cargo.toml", "README.md", "src/**/*.rs", "examples/**/*.rs", "examples/**/*.png"]

[lib]
path = "src/lib.rs"

[[example]]
name = "cli_tetris"
path = "examples/cli_tetris.rs"

[[example]]
name = "all_games"
path = "examples/all_games.rs"

[features]
default = []

[package.metadata.docs.rs]
all-features = true

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
overflow-checks = false
