[package]
name = "microgames"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "no_std microgame business logic: plug in events, input, and output"
homepage = "https://github.com/t4ce/MicroGames"
repository = "https://github.com/t4ce/MicroGames"
readme = "README.md"
keywords = ["games", "no-std", "tetris", "embedded", "logic"]
categories = ["game-development", "no-std", "embedded"]
include = ["Cargo.toml", "README.md", "src/**/*.rs", "examples/**/*.rs"]

[lib]
path = "src/lib.rs"

[[example]]
name = "cli_tetris"
path = "examples/cli_tetris.rs"

[features]
default = []
